[project]
name = "ai-agent-debate"
version = "1.0.0"
description = "AI Agent Orchestration HW2 — Dogs vs Cats debate with Judge + Pro + Con agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sharbel Maroun", email = "142183717+SharbelMaroun@users.noreply.github.com" },
    { name = "Amr Safadi", email = "safadiamr02@gmail.com" },
]
keywords = ["ai", "agents", "debate", "orchestration", "llm", "anthropic", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "duckduckgo-search>=6.0.0",
    "rich>=13.0.0",
    "google-generativeai>=0.8.6",
]

[project.optional-dependencies]
openai = ["openai>=1.50.0"]

# Dev tooling — uv installs this group by default on `uv sync`.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[project.scripts]
debate = "debate.main:cli"

[project.urls]
Repository = "https://github.com/SharbelMaroun/AI-Agent-Orchestration-HW2"
Issues = "https://github.com/SharbelMaroun/AI-Agent-Orchestration-HW2/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debate"]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter). Zero violations required — see CLAUDE.md §7.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802"]  # test function names may exceed naming convention

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Coverage. Threshold ≥ 85% required — see CLAUDE.md §6.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/debate/main.py",
    "*/tests/*",
    "src/debate/**/gui/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is opt-in during Phases 2–5 (skeleton code). From Phase 6 onward,
# CI uses `uv run pytest --cov=debate --cov-report=term-missing` which enforces
# `fail_under = 85` from `[tool.coverage.report]`.
addopts = "-ra --strict-markers"
markers = [
    "integration: marks tests as integration (deselect with -m 'not integration')",
    "slow: marks tests as slow",
]
