# Pre-commit hooks — blocks commits that fail lint/format gates locally.
# Each developer runs `uv run pre-commit install` once after cloning.
# CI re-runs these via `pre-commit run --all-files` (see .github/workflows/ci.yml).

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
